<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Parquet Viewer | Prabakar's GitHub Tools</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" /><link rel="stylesheet" href="styles.css" /></head>
  <body class="tool-page"><main class="tool-layout"><nav class="tool-nav"><a class="brand" href="index.html" aria-label="Prabakar's GitHub home"><span class="brand-mark" aria-hidden="true">PG</span><span class="brand-name">PRABAKAR'S GITHUB</span></a><div class="nav-links"><a href="index.html#tools">ALL TOOLS</a><a class="active" href="parquet.html">PARQUET</a></div></nav>
    <header class="tool-header"><p class="eyebrow">TOOL 18 / DATA</p><h1>Parquet <em>Viewer</em></h1><p>Inspect column schema and preview rows from a Parquet file locally in your browser.</p></header>
    <div class="control-row"><label class="file-button">IMPORT PARQUET<input type="file" id="parquet-file" accept=".parquet,application/octet-stream" /></label></div>
    <section class="work-area convert-layout"><div class="work-panel"><div class="panel-header"><label>SCHEMA</label></div><div id="parquet-schema" class="result-area data-preview" aria-live="polite">Schema details will appear here.</div></div><div class="work-panel"><div class="panel-header"><label>ROW PREVIEW</label></div><div id="parquet-output" class="result-area data-preview" aria-live="polite">Preview rows will appear here.</div></div></section><p id="parquet-status" class="status" aria-live="polite">DuckDB loads in your browser when needed.</p>
  </main><script type="module">import * as duckdb from "https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.29.0/+esm"; window.duckdbWasm = duckdb; window.dispatchEvent(new Event("duckdb-ready"));</script><script src="app.js"></script></body>
