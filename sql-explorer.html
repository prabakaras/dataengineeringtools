<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>SQL Data Explorer | Prabakar's GitHub Tools</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" /><link rel="stylesheet" href="styles.css" /></head>
  <body class="tool-page"><main class="tool-layout"><nav class="tool-nav"><a class="brand" href="index.html" aria-label="Prabakar's GitHub home"><span class="brand-mark" aria-hidden="true">PG</span><span class="brand-name">PRABAKAR'S GITHUB</span></a><div class="nav-links"><a href="index.html#tools">ALL TOOLS</a><a class="active" href="sql-explorer.html">SQL EXPLORER</a></div></nav>
    <header class="tool-header"><p class="eyebrow">TOOL 17 / QUERY</p><h1>SQL Data <em>Explorer</em></h1><p>Import a local CSV, JSON, or Parquet file and run SQL directly in your browser using DuckDB-Wasm.</p></header>
    <section class="work-panel form-panel"><div class="generator-controls"><label>TABLE NAME <input id="sqlx-table" type="text" value="local_data" /></label><label class="file-button">IMPORT FILE<input type="file" id="sqlx-file" accept=".csv,.json,.parquet" /></label><button type="button" id="sqlx-sample">SAMPLE QUERY</button><button type="button" id="sqlx-run">RUN QUERY</button></div></section>
    <section class="work-area convert-layout"><div class="work-panel"><div class="panel-header"><label for="sqlx-query">SQL QUERY</label></div><textarea id="sqlx-query" spellcheck="false" placeholder="SELECT * FROM local_data LIMIT 50;" aria-label="SQL explorer query"></textarea></div><div class="work-panel"><div class="panel-header"><label>QUERY RESULTS</label></div><div id="sqlx-output" class="result-area data-preview" aria-live="polite">Import a file and run a query.</div></div></section><p id="sqlx-status" class="status" aria-live="polite">DuckDB loads in your browser when needed.</p>
  </main><script type="module">import * as duckdb from "https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.29.0/+esm"; window.duckdbWasm = duckdb; window.dispatchEvent(new Event("duckdb-ready"));</script><script src="app.js"></script></body>
</html>
