<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Data Masking | Prabakar's GitHub Tools</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" /><link rel="stylesheet" href="styles.css" /></head>
  <body class="tool-page"><main class="tool-layout"><nav class="tool-nav"><a class="brand" href="index.html" aria-label="Prabakar's GitHub home"><span class="brand-mark" aria-hidden="true">PG</span><span class="brand-name">PRABAKAR'S GITHUB</span></a><div class="nav-links"><a href="index.html#tools">ALL TOOLS</a><a class="active" href="mask.html">MASK</a></div></nav>
    <header class="tool-header"><p class="eyebrow">TOOL 10 / PRIVACY</p><h1>Data <em>Masking</em></h1><p>Mask email addresses, phone numbers, and long ID values in extracts before sending them to a ticket or chat.</p></header>
    <div class="mask-options"><label><input type="checkbox" id="mask-email" checked /> Email</label><label><input type="checkbox" id="mask-phone" checked /> Phone</label><label><input type="checkbox" id="mask-id" checked /> Long IDs</label><button type="button" id="mask-run">MASK DATA</button><button type="button" id="mask-sample">LOAD SAMPLE</button></div><section class="work-area"><div class="work-panel"><div class="panel-header"><label for="mask-input">ORIGINAL TEXT</label></div><textarea id="mask-input" spellcheck="false" aria-label="Data to mask"></textarea></div><div class="direction" aria-hidden="true">→</div><div class="work-panel"><div class="panel-header"><label>MASKED TEXT</label><button type="button" id="mask-copy">COPY</button></div><pre id="mask-output" aria-live="polite">Masked text will appear here.</pre></div></section><p id="mask-status" class="status" aria-live="polite">Input is never uploaded.</p>
  </main><script src="app.js"></script></body>
</html>
