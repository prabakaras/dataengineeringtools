<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Formatter | Workbench</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="tool-page">
    <main class="tool-layout">
      <nav class="tool-nav"><a class="brand" href="index.html" aria-label="Prabakar's GitHub home"><span class="brand-mark" aria-hidden="true">PG</span><span class="brand-name">PRABAKAR'S GITHUB</span></a><div class="nav-links"><a class="active" href="json.html">JSON</a><a href="convert.html">CONVERT</a><a href="sql.html">SQL</a></div></nav>
      <header class="tool-header"><p class="eyebrow">TOOL 01 / DATA</p><h1>JSON Formatter<br /><em>&amp; Validator</em></h1><p>Paste JSON to validate it and get a clean, readable result. Your input stays in this browser.</p></header>
      <section class="work-area">
        <div class="work-panel"><div class="panel-header"><label for="json-input">INPUT</label><button type="button" id="json-sample">SAMPLE</button></div><textarea id="json-input" spellcheck="false" placeholder='{"project":"Workbench"}' aria-label="JSON input"></textarea></div>
        <div class="direction" aria-hidden="true">→</div>
        <div class="work-panel"><div class="panel-header"><label for="json-output">FORMATTED</label><div class="panel-actions"><button type="button" id="json-copy">COPY</button><button type="button" id="json-clear">CLEAR</button></div></div><pre id="json-output" aria-live="polite">Formatted JSON will appear here.</pre></div>
      </section>
      <p id="json-status" class="status" aria-live="polite">Waiting for JSON input.</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
