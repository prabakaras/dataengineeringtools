  <body class="tool-page"><main class="tool-layout"><nav class="tool-nav"><a class="brand" href="index.html" aria-label="Prabakar's GitHub home"><span class="brand-mark" aria-hidden="true">PG</span><span class="brand-name">PRABAKAR'S GITHUB</span></a><div class="nav-links"><a href="index.html#tools">ALL TOOLS</a><a class="active" href="quality.html">QUALITY</a></div></nav>
    <header class="tool-header"><p class="eyebrow">TOOL 09 / DATA QUALITY</p><h1>Data Quality <em>Rules</em></h1><p>Generate practical SQL checks for nulls, duplicates, valid values, and numerical ranges.</p></header>
    <section class="work-panel form-panel"><div class="form-grid"><label>TABLE <input id="quality-table" type="text" value="orders" /></label><label>COLUMN <input id="quality-column" type="text" value="customer_id" /></label><label>RULE <select id="quality-rule"><option value="not-null">Not null</option><option value="unique">Unique</option><option value="range">Numeric range</option><option value="accepted">Accepted values</option></select></label><label id="quality-detail-wrap">DETAIL <input id="quality-detail" type="text" placeholder="For example: 0,100 or paid,refunded" /></label></div><div class="control-row"><button type="button" id="quality-run">GENERATE CHECK</button><button type="button" id="quality-sample">LOAD EXAMPLE</button></div></section><section class="work-panel result-panel"><div class="panel-header"><label>GENERATED SQL</label><button type="button" id="quality-copy">COPY</button></div><pre id="quality-output">Select a rule to generate a data-quality check.</pre></section><p id="quality-status" class="status" aria-live="polite">Rules are generated locally and should be reviewed for your SQL dialect.</p>
